name: Build and Publish Latest and Beta Tags

on:
  schedule:
    # Runs every Sunday at 04:00 AM UTC to catch new updates
    - cron: '0 4 * * 0'
  push:
    branches: [ "master" ]
    paths:
      - 'ytmusic/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    # Allows manual triggers

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and publish ${{ matrix.version }}
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@master
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: [latest, beta]
    with:
      runs-on: ubuntu-latest
      image: ghcr.io/${{ github.repository }}
      context: .
      file: Dockerfile
      platforms: linux/amd64,linux/arm64
      qemu: true
      cache-scope: ${{ matrix.version }}
      build-args: |
        MA_VERSION=${{ matrix.version }}
      tags: |
        type=raw,value=${{ matrix.version }}
        type=raw,value=${{ matrix.version }}-${{ github.run_id }}
      labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.title=music-assistant-yt-music
        org.opencontainers.image.description=Music Assistant with YouTube Music provider
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
