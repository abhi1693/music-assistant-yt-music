name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh scripts/install_watcher_addon.sh
          shellcheck -s sh tests/test_install_watcher_addon.sh
          shellcheck -s sh scripts/install_provider.sh
          shellcheck -s sh tests/test_install_provider.sh

      - name: Run installer test suite (POSIX sh, dash)
        run: |
          dash tests/test_install_watcher_addon.sh
          dash tests/test_install_provider.sh
          dash tests/test_watcher_autoupdate.sh

      - name: Run installer test suite (bash, for parity)
        run: |
          bash tests/test_install_watcher_addon.sh
          bash tests/test_install_provider.sh
          bash tests/test_watcher_autoupdate.sh

  busybox:
    # Runs the suite inside Alpine, which uses BusyBox ash + BusyBox utilities
    # (tar, grep, sed, mktemp, head). This is the same userland HAOS ships, so
    # passing here is strong evidence the installer will work on a real HAOS
    # box. We deliberately do NOT install git in the container — the script
    # must rely on curl + tar only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run installer test suite inside alpine (BusyBox ash)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            alpine:3.20 \
            sh -c 'apk add --no-cache curl ca-certificates jq bash >/dev/null \
                   && echo "shell: $(readlink -f /bin/sh)" \
                   && busybox --help 2>&1 | head -1 \
                   && sh tests/test_install_watcher_addon.sh \
                   && sh tests/test_install_provider.sh \
                   && sh tests/test_watcher_autoupdate.sh'

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 matches the Python version Music Assistant currently ships in
        # its container. 3.11 is the lowest version the model classes have
        # historically supported, so we cover the floor too.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -r tests/python/requirements.txt

      - name: Run provider unit tests
        run: python -m pytest tests/python -v

  docker-lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build (Single-Arch, No Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # Loads image into local docker daemon for inspection
          tags: local-test-image:latest
          build-args: MA_VERSION=latest

      - name: Assert provider files exist in site-packages
        run: |
          # Spin up the built container and verify the provider directory exists in the computed venv path
          # We use --entrypoint sh to override the default "mass" entrypoint of the image
          docker run --rm --entrypoint sh local-test-image:latest -c '
            PYVER=""
            
            # Clean POSIX alternative to ls | grep
            for d in /app/venv/lib/python3.*/; do
              if [ -d "$d" ]; then
                PYVER=$(basename "$d")
                break
              fi
            done
            
            [ -z "$PYVER" ] && PYVER="python3.13"
            
            TARGET_DIR="/app/venv/lib/$PYVER/site-packages/music_assistant/providers/ytmusic_free"
            echo "Checking path: $TARGET_DIR"
            if [ -d "$TARGET_DIR" ] && [ -f "$TARGET_DIR/manifest.json" ]; then
              echo "Success: Provider files verified in venv."
            else
              echo "Error: Provider files missing from expected site-packages path!" >&2
              exit 1
            fi
          '
